<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- The same stamp pieces as the landing page: the ring frame and the arc the words sit on -->

        <defs>
            <path id="stamp-arc-path" d="M 19 60 A 41 41 0 0 1 101 60" />
            <symbol id="stamp-frame" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3.5" stroke-dasharray="40 1.5 22 2 60 1 30 2.5" />
                <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="1.2" />
                <circle cx="60" cy="60" r="32" fill="none" stroke="currentColor" stroke-width="1.2" />

        </defs>
    </svg>

    <header class="site-header">
        <div class="container">

                Stamped!

    <main id="main">

            <svg class="stamp stamp--band" viewBox="0 0 120 120" aria-hidden="true"><use href="#stamp-frame" /><text class="stamp-arc"><textPath href="#stamp-arc-path" startOffset="50%">BON VOYAGE</textPath></text><text class="stamp-big" x="60" y="64">DEPART</text><text class="stamp-small" x="60" y="77">2026</text></svg>

            <div class="container">
                <svg class="stamp stamp--orange subscribed-stamp" viewBox="0 0 120 120" aria-hidden="true"><use href="#stamp-frame" /><text class="stamp-arc"><textPath href="#stamp-arc-path" startOffset="50%">ON THE LIST</textPath></text><text class="stamp-big" x="60" y="64">NEWS</text><text class="stamp-small" x="60" y="77">2026</text></svg>

                <p class="signup-note">A few emails a year. Unsubscribe anytime.</p>
                <a class="header-button subscribed-back" href="stamped-app.html">Back to Stamped!</a>
